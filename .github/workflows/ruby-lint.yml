name: ruby-lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ruby-lint:
    name: ruby-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # pin@v4

      - uses: ruby/setup-ruby@54a18e26dbbb1eabc604f317ade9a5788dddef81 # pin@v1.159.0
        with:
          bundler-cache: true

      - name: lint
        run: script/lint
